[project]
name = "gamesom-mcp"
version = "0.1.0"
description = "MCP server exposing the gamesom library to Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
gamesom-mcp = "gamesom_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
