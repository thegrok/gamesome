version: 2

project_name: gamesome

before:
  hooks:
    - go mod tidy

builds:
  - binary: gamesome
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/thegrok/gamesome/cmd.Version={{.Version}}
    hooks:
      post:
        # One .mcpb bundle per built binary (A095) — manifest + binary zipped
        # to the MCPB spec, attached to the release via release.extra_files.
        - cmd: ./scripts/build-mcpb.sh "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" "{{ .Version }}"

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # Derive the GitHub pre-release flag from the tag: anything with a suffix
  # (-alpha.N, -rc.N) publishes as a pre-release, plain vX.Y.Z as a full one.
  # Without this the alpha would take the "Latest" badge and /releases/latest.
  prerelease: auto
  extra_files:
    - glob: dist/mcpb/*.mcpb
  # Sits above the generated changelog, so the notes open with what the release
  # is rather than with a wall of commit subjects.
  header: |
    gamesome imports your Steam, GOG, Epic and itch.io libraries and briefs
    Claude as a sommelier for your own backlog — what to play tonight given
    your energy, your mood, and the time you actually have. It recommends only
    from games you already own.

    **What "alpha" means here.** The sommelier's judgments about individual
    games accumulate as you use it, so early recommendations lean on titles and
    genre metadata rather than on much taste history — it gets better the more
    you talk to it. The Steam import covers *installed* games with no setup;
    ask in conversation to connect your full owned library. Expect the local
    database schema to move between alpha releases.

    Install instructions are at the bottom of this page.

    <details>
    <summary>Full changelog</summary>

  # NOTE: the <details> block opened at the end of `header` is closed at the top
  # of `footer`, wrapping the generated changelog between them — GoReleaser
  # composes the notes as header + changelog + footer and has no option of its
  # own for collapsing. The two tags are split across these keys, so editing one
  # without the other orphans the block. The blank line after <summary> is also
  # load-bearing: without it GitHub won't render the markdown list inside.
  footer: |

    </details>

    ## One-click install (Claude Desktop)

    Download the `.mcpb` bundle for your platform above, then double-click it
    (or Claude Desktop → Settings → Extensions → Install Extension). Ask
    Claude: *"what should I play tonight?"*

    Updating: bundles installed from a file don't auto-update — download the
    new `.mcpb` and install it over the old one. If tool calls stop
    responding, toggle the extension off and on in Settings → Extensions.

changelog:
  # No `sort:` — asc/desc sort alphabetically by commit subject, not by date.
  # That is what turned the v1.0.0-alpha.1 notes into a jumble: "Initial commit"
  # landed mid-list and all 44 merge commits piled up together. Omitting the key
  # keeps git's own chronological order.

  # Short SHA rather than the default 40 characters.
  format: "{{ slice .SHA 0 7 }} {{ .Message }}"
  filters:
    exclude:
      # Merge commits and spec commits are the bulk of the noise: 44 and 21
      # respectively out of 144 at alpha.1. The trailing-colon patterns that
      # were here before assumed conventional-commit subjects, which this
      # history mostly doesn't use — they matched 6 commits in total.
      - "^Merge "
      - "^[Ss]pec:"
      - "^docs"
      - "^test"
      - "^chore"
